{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="panel p-8 max-w-2xl mx-auto mt-12 text-center">
  <i data-lucide="{{ icon }}" class="w-10 h-10 text-cyan-400 mx-auto mb-4"></i>
  <h2 class="text-xl font-semibold mb-2">{{ page_title }}</h2>
  <p class="text-sm text-slate-400">{{ description }}</p>
  <div class="mt-6">
    <a href="{{ url_for('recon') }}" class="btn btn-primary">
      <i data-lucide="arrow-left" class="w-3 h-3"></i> Back to Recon
    </a>
  </div>
</div>
{% endblock %}
