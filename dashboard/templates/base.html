<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <title>VulnPilot AI · {% block title %}Attack Control Center{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind via Play CDN (no build step) -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto'],
            mono: ['JetBrains Mono', 'Fira Code', 'ui-monospace', 'monospace']
          },
          colors: {
            ink: {
              950: '#070b14',
              900: '#0b1220',
              800: '#111a2e',
              700: '#1a2540',
              600: '#243154',
              500: '#3b4a73'
            },
            cyber: {
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2'
            }
          },
          boxShadow: {
            'glow-cyan': '0 0 0 1px rgba(34,211,238,0.35), 0 0 20px -2px rgba(34,211,238,0.45)',
            'glow-red':  '0 0 0 1px rgba(239,68,68,0.35),  0 0 20px -2px rgba(239,68,68,0.45)',
            'panel': 'inset 0 1px 0 0 rgba(255,255,255,0.04), 0 1px 0 0 rgba(0,0,0,0.5)'
          },
          backgroundImage: {
            'grid': 'linear-gradient(rgba(34,211,238,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(34,211,238,0.06) 1px, transparent 1px)',
            'panel-gradient': 'linear-gradient(180deg, rgba(34,211,238,0.04) 0%, rgba(0,0,0,0) 60%)'
          }
        }
      }
    }
  </script>

  <!-- Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Alpine.js for reactivity, no build step -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

  <!-- Chart.js for CVSS gauges and severity sparklines -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}" />
</head>

<body class="font-sans antialiased text-slate-200 bg-ink-950 min-h-screen overflow-hidden"
      x-data="{ active: '{{ active|default('recon') }}' }">

  <!-- Decorative grid background -->
  <div class="fixed inset-0 bg-grid bg-[size:48px_48px] opacity-40 pointer-events-none"></div>
  <div class="fixed inset-0 bg-gradient-to-b from-cyan-500/5 via-transparent to-transparent pointer-events-none"></div>

  <div class="relative flex h-screen">
    {% include "partials/_sidebar.html" %}

    <div class="flex-1 flex flex-col min-w-0">
      {% include "partials/_topbar.html" %}

      <main class="flex-1 overflow-y-auto overflow-x-hidden px-4 pb-4 pt-2">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script>
    // Render Lucide icons after DOM ready and after Alpine swaps
    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
    document.addEventListener('alpine:initialized', () => lucide.createIcons());
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
